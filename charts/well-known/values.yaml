# Default values for well-known.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 2

image:
  repository: ghcr.io/stenic/well-known
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

resources:
  limits:
    cpu: 50m
    memory: 64Mi
  requests:
    cpu: 20m
    memory: 32Mi

podDisruptionBudget:
  maxUnavailable: 1

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations:
  cluster-autoscaler.kubernetes.io/safe-to-evict: "true"

# Namespaced custom resources to discover, as group/version/resource.
customResources:
  - gateway.networking.k8s.io/v1/gateways
  - gateway.networking.k8s.io/v1/httproutes

podSecurityContext: {}
  # fsGroup: 2000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /.well-known/
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# Requires the Gateway API CRDs to be installed in the cluster.
httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
  hostnames:
    - chart-example.local
  # Additional HTTPRoute rule fields such as filters and timeouts.
  # The path match and backend reference are generated by the chart.
  rule: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

networkpolicies:
  enabled: false
  kubeApi: []
    # kubectl get svc -n default kubernetes -oyaml
    # - addresses:
    #     - 10.0.0.153
    #     - 10.0.0.90
    #   ports:
    #     - 443

nodeSelector: {}

tolerations: []

affinity: {}
