{{- if .Values.httpRoute.enabled -}}
{{- $fullName := include "well-known.fullname" . -}}
{{- $svcPort := .Values.service.port -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "well-known.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- $rule := deepCopy .Values.httpRoute.rule }}
    {{- $_ := set $rule "matches" (list (dict "path" (dict "type" "PathPrefix" "value" "/.well-known/"))) }}
    {{- $_ := set $rule "backendRefs" (list (dict "name" $fullName "port" $svcPort)) }}
    {{- toYaml (list $rule) | nindent 4 }}
{{- end }}
