apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "well-known.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "well-known.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - watch
  - list
  - get
- apiGroups:
  - networking.k8s.io
  resources:
  - ingresses
  verbs:
  - watch
  - list
  - get
{{- range .Values.customResources }}
{{- $resource := splitList "/" . }}
- apiGroups:
  - {{ index $resource 0 | quote }}
  resources:
  - {{ index $resource 2 | quote }}
  verbs:
  - watch
  - list
  - get
{{- end }}
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - create
  - update
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - create
  - update
